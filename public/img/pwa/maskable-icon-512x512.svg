<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Maskable background (full circle for safe zone) -->
    <circle cx="256" cy="256" r="256" fill="url(#maskGrad)"/>
    
    <!-- Icon in safe zone -->
    <g transform="translate(256, 256)">
        <!-- Building outline -->
        <rect x="-70" y="-50" width="140" height="120" fill="white" opacity="0.95" rx="8"/>
        
        <!-- Windows -->
        <rect x="-50" y="-30" width="25" height="25" fill="#3B82F6" rx="3"/>
        <rect x="-15" y="-30" width="25" height="25" fill="#3B82F6" rx="3"/>
        <rect x="20" y="-30" width="25" height="25" fill="#3B82F6" rx="3"/>
        
        <rect x="-50" y="10" width="25" height="25" fill="#3B82F6" rx="3"/>
        <rect x="-15" y="10" width="25" height="25" fill="#3B82F6" rx="3"/>
        <rect x="20" y="10" width="25" height="25" fill="#3B82F6" rx="3"/>
        
        <!-- Door -->
        <rect x="-20" y="45" width="40" height="40" fill="#8B4513" rx="3"/>
        <circle cx="-5" cy="65" r="3" fill="#FFD700"/>
        
        <!-- Roof -->
        <polygon points="-70,-50 0,-100 70,-50" fill="#DC2626"/>
    </g>
</svg>