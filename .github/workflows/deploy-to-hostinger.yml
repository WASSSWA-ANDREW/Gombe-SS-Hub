name: Build & Deploy to Hostinger (SSH)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, openssl, pdo_mysql, xml, zip

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build frontend assets (if present)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run production || npm run prod || true
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << EOF
          Host hostinger
            HostName ${{ secrets.HOSTINGER_HOST }}
            User ${{ secrets.HOSTINGER_USER }}
            Port ${{ secrets.HOSTINGER_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy via SCP
        run: |
          # Remove .env, node_modules, and git files before transfer
          rm -rf .git .gitignore node_modules storage/logs/* bootstrap/cache/*
          
          # Create tar archive
          tar -czf deploy.tar.gz --exclude='.env' --exclude='storage/logs' --exclude='bootstrap/cache' .
          
          # Copy to server
          scp -P ${{ secrets.HOSTINGER_PORT }} deploy.tar.gz ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_TARGET }}/
          
          echo "✓ Archive uploaded successfully"

      - name: Extract and run commands
        run: |
          ssh -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} << 'ENDSSH'
          
          cd ${{ secrets.HOSTINGER_TARGET }}
          
          echo "=== Deployment Status ==="
          echo "Current directory: $(pwd)"
          echo "Expected: /home/u933773389/domains/gombesshub.com/public_html/"
          echo ""
          
          # Backup current files
          if [ -d "app" ]; then
            tar -czf backup_$(date +%s).tar.gz app config routes database --ignore-failed-read 2>/dev/null || true
            echo "✓ Backup created"
          fi
          
          # Extract uploaded archive
          tar -xzf deploy.tar.gz
          rm deploy.tar.gz
          
          echo "✓ Files extracted"
          echo ""
          
          # Set permissions
          chmod -R 755 storage bootstrap/cache public
          
          echo "=== Running Artisan Commands ==="
          php artisan migrate --force 2>&1 || echo "⚠ Migration skipped"
          php artisan config:clear && php artisan config:cache
          php artisan route:clear && php artisan route:cache
          php artisan view:clear && php artisan view:cache
          
          echo ""
          echo "=== Verification ==="
          echo "✓ .htaccess exists:"
          ls -la public/.htaccess
          echo ""
          echo "✓ APP_URL:"
          grep APP_URL .env
          echo ""
          echo "✓ Laravel ready:"
          php artisan --version
          
          ENDSSH
          echo ""
          echo "✓ Deployment Complete!"
          ENDSSH
