name: Build & Deploy to Hostinger (SSH)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, openssl, pdo_mysql, xml, zip
          ini-values: post_max_size=256M, upload_max_filesize=256M

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build frontend assets (if present)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run production || npm run prod || true
          fi

      - name: Transfer files via SSH (tar pipe)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            mkdir -p ${{ secrets.HOSTINGER_TARGET }}
            cd ${{ secrets.HOSTINGER_TARGET }}
            echo "Target directory ready: $(pwd)"
      
      - name: Upload files via SSH
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='.github' -czf - . | \
          ssh -i ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }} \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p ${{ secrets.HOSTINGER_PORT }} \
              ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} \
              "cd ${{ secrets.HOSTINGER_TARGET }} && tar -xzf -"

      - name: Deploy via SSH (copy files)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script_stop: true
          script: |
            cd ${{ secrets.HOSTINGER_TARGET }}
            pwd
            ls -la

      - name: Run remote artisan commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ${{ secrets.HOSTINGER_TARGET }}
            php artisan migrate --force || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            php artisan storage:link || true
